name: taskpulse
description: "TaskPulse - Cross-platform real-time task manager, interactive Gantt chart, FPV life cockpit and on-call rotation scheduler."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  # CopyWith & JSON Annotations
  copy_with_extension: ^5.0.4
  json_annotation: ^4.8.1
  # REST API with Dio
  dio: ^5.4.1
  retrofit: ^4.1.0
  # Persistence & Real-time
  supabase_flutter: ^2.5.0
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.5
  mocktail: ^1.0.3
  flutter_lints: ^3.0.0
  # Generators
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  copy_with_extension_gen: ^5.0.4
  retrofit_generator: ^8.1.0

flutter:
  uses-material-design: true
